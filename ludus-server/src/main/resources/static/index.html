<!doctype html>
<!--
  One file, no build step, no dependencies.

  Not a stylistic preference: this page is served by the same jar as the API, and a page that needed npm
  to exist would mean the service could not be run with one command. The board is inline SVG and the
  pieces are Unicode, so there is nothing to fetch and nothing to go stale.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ludus</title>
<style>
  /*
    Light by default, dark when the reader's system asks for it. Every colour is a token defined once
    here, so the dark block below only has to restate the handful that actually change roles.
  */
  :root {
    --paper:      #fcfcfb;
    --ink:        #1b1c1e;
    --muted:      #74767b;
    --faint:      #9a9ca1;
    --rule:       #e7e6e2;
    --raised:     #f4f3f0;

    --light-sq:   #eeedea;
    --dark-sq:    #b3b0a6;
    --moved:      #e4d9a9;
    --marker:     rgba(27, 28, 30, .22);
    --chosen:     #1b1c1e;

    --white-pc:   #ffffff;
    --white-edge: #43443f;
    --black-pc:   #2c2d2f;

    --accent:     #1b1c1e;
    --on-accent:  #fcfcfb;
    --warn:       #a4463c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:      #16171a;
      --ink:        #e9e8e4;
      --muted:      #8d8f95;
      --faint:      #6c6e74;
      --rule:       #26282c;
      --raised:     #1d1f23;

      --light-sq:   #d5d3cc;
      --dark-sq:    #7e8275;
      --moved:      #b9a870;
      --marker:     rgba(10, 11, 12, .3);
      --chosen:     #e9e8e4;

      --accent:     #e9e8e4;
      --on-accent:  #16171a;
      --warn:       #d98d84;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 24px 56px;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .page { width: 100%; max-width: 940px; }

  header { margin-bottom: 34px; }
  h1 {
    font-size: 19px; font-weight: 600; letter-spacing: -.015em;
    margin: 0 0 3px;
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  header a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
  header a:hover { border-bottom-color: var(--muted); }

  .split { display: grid; grid-template-columns: 1fr 236px; gap: 44px; align-items: start; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; gap: 32px; } }

  svg { width: 100%; height: auto; display: block; }
  .sq { cursor: pointer; }
  /*
    Everything drawn over a square must be transparent to clicks. The markers sit exactly where you are
    about to click, so without this the marker swallows the click meant for the square beneath it and
    nothing happens at all — a bug you cannot see, only feel.
  */
  .mark, .piece, .coord { pointer-events: none; }
  .piece { font-size: 66px; user-select: none; }
  .piece.w { fill: var(--white-pc); stroke: var(--white-edge); stroke-width: 1.4px; paint-order: stroke; }
  .piece.b { fill: var(--black-pc); }
  .coord { font-size: 13px; fill: var(--ink); opacity: .34; user-select: none; }

  /* The sidebar has no boxes. Groups are separated by space and one hairline, nothing else. */
  .group + .group { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--rule); }
  .group h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em;
    color: var(--faint); margin: 0 0 14px;
  }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  select {
    width: 100%; padding: 7px 0; margin-bottom: 16px;
    font: inherit; color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid var(--rule);
    border-radius: 0; cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%),
                      linear-gradient(135deg, var(--faint) 50%, transparent 50%);
    background-position: calc(100% - 9px) 15px, calc(100% - 4px) 15px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:focus-visible { outline: none; border-bottom-color: var(--ink); }

  button {
    font: inherit; font-size: 14px; cursor: pointer; border-radius: 6px;
    padding: 8px 14px; border: 1px solid var(--rule); background: transparent; color: var(--ink);
  }
  button:hover:not(:disabled) { background: var(--raised); }
  button.solid { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.solid:hover:not(:disabled) { opacity: .86; background: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.wide { width: 100%; }
  .buttons { display: flex; gap: 8px; }

  .state { font-size: 14px; margin: 16px 0 0; min-height: 22px; }
  .state.bad { color: var(--warn); }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.75;
  }
  .stream { max-height: 150px; overflow-y: auto; margin-top: 12px; }
  .stream div { color: var(--muted); white-space: nowrap; }
  .stream div:first-child { color: var(--ink); }
  /*
    Wrapping happens between moves, never inside one. `break-all` split "d7d5" across two lines, which
    reads as two different moves — the list is already space-separated, so the default is what was wanted.
  */
  .history { color: var(--muted); max-height: 92px; overflow-y: auto; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>ludus</h1>
    <p>
      A chess engine written from scratch in Java. Click a piece, then a square.
      <a href="/swagger-ui.html">API</a> · <a href="https://github.com/LorenzoVicino/ludus">Source</a>
    </p>
  </header>

  <div class="split">
    <svg id="board" viewBox="0 0 800 800" role="img" aria-label="Chess board"></svg>

    <div>
      <div class="group">
        <h2>Game</h2>
        <label for="level">Strength</label>
        <select id="level">
          <option value="BEGINNER">Beginner</option>
          <option value="CASUAL">Casual</option>
          <option value="CLUB" selected>Club</option>
          <option value="STRONG">Strong</option>
          <option value="MAXIMUM">Maximum</option>
        </select>
        <label for="colour">You play</label>
        <select id="colour">
          <option value="true" selected>White</option>
          <option value="false">Black</option>
        </select>
        <div class="buttons">
          <button class="solid" id="new">New game</button>
          <button id="resign">Resign</button>
        </div>
        <p class="state" id="status">Start a game.</p>
      </div>

      <div class="group">
        <h2>Its reply</h2>
        <dl class="facts">
          <dt>Move</dt><dd id="m-move">—</dd>
          <dt>Score</dt><dd id="m-score">—</dd>
          <dt>Depth</dt><dd id="m-depth">—</dd>
          <dt>Positions</dt><dd id="m-nodes">—</dd>
        </dl>
      </div>

      <div class="group">
        <h2>Thinking</h2>
        <button class="wide" id="analyse">Show me what it sees</button>
        <div class="stream mono" id="think"></div>
      </div>

      <div class="group">
        <h2>Moves</h2>
        <div class="history mono" id="moves">—</div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/*
  The solid glyphs for both colours, coloured by fill rather than by using the outlined set for white.
  Mixing the two Unicode sets makes the white pieces look like a different typeface from the black ones.
*/
const GLYPH = { P: '♟', N: '♞', B: '♝', R: '♜', Q: '♛', K: '♚' };
const FILES = 'abcdefgh';

let game = null;
let selected = null;
let flipped = false;
let stream = null;

const $ = id => document.getElementById(id);

/** The board is drawn from the FEN, so the server's position is the only position. */
function draw() {
  const placement = game ? game.fen.split(' ')[0]
                         : 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
  const rows = placement.split('/');
  const last = game && game.moves.length ? game.moves[game.moves.length - 1] : null;

  const at = new Map();
  for (let rank = 0; rank < 8; rank++) {
    let file = 0;
    for (const ch of rows[rank]) {
      if (ch >= '1' && ch <= '8') { file += +ch; continue; }
      at.set(FILES[file] + (8 - rank), {
        glyph: GLYPH[ch.toUpperCase()],
        colour: ch === ch.toUpperCase() ? 'w' : 'b'
      });
      file++;
    }
  }

  let out = '';
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const rank = flipped ? row + 1 : 8 - row;
      const file = flipped ? FILES[7 - col] : FILES[col];
      const square = file + rank;
      const x = col * 100, y = row * 100;

      let fill = (row + col) % 2 === 0 ? 'var(--light-sq)' : 'var(--dark-sq)';
      if (last && (square === last.slice(0, 2) || square === last.slice(2, 4))) fill = 'var(--moved)';

      out += `<rect class="sq" data-sq="${square}" x="${x}" y="${y}" width="100" height="100" fill="${fill}"/>`;

      // A marker on every square this piece may reach. The server sends the legal moves with the
      // position, so the browser never guesses and never has to ask.
      if (selected && game && game.legalMoves.some(m => m.startsWith(selected + square))) {
        out += at.has(square)
          ? `<circle class="mark" cx="${x + 50}" cy="${y + 50}" r="43" fill="none"
                     stroke="var(--marker)" stroke-width="6"/>`
          : `<circle class="mark" cx="${x + 50}" cy="${y + 50}" r="13" fill="var(--marker)"/>`;
      }
      if (selected === square) {
        out += `<rect class="mark" x="${x + 1.5}" y="${y + 1.5}" width="97" height="97" fill="none"
                      stroke="var(--chosen)" stroke-width="3"/>`;
      }

      const piece = at.get(square);
      if (piece) {
        out += `<text class="piece ${piece.colour}" x="${x + 50}" y="${y + 74}"
                      text-anchor="middle">${piece.glyph}</text>`;
      }

      // Coordinates on the two outer edges only, which is enough to read the board and quiet enough
      // not to compete with the pieces.
      if (col === 0) {
        out += `<text class="coord" x="${x + 7}" y="${y + 21}">${rank}</text>`;
      }
      if (row === 7) {
        out += `<text class="coord" x="${x + 93}" y="${y + 93}" text-anchor="end">${file}</text>`;
      }
    }
  }

  const svg = $('board');
  svg.innerHTML = out;
  svg.querySelectorAll('.sq').forEach(el => el.addEventListener('click', () => clicked(el.dataset.sq)));
}

function clicked(square) {
  if (!game || !game.yourTurn) return;

  if (selected) {
    const candidates = game.legalMoves.filter(m => m.startsWith(selected + square));
    selected = null;
    if (candidates.length) {
      // A promotion is four moves sharing two squares, so the piece has to be asked for.
      const move = candidates.length === 1 ? candidates[0] : promotionChoice(candidates);
      if (move) { play(move); return; }
    }
    draw();
    return;
  }

  if (game.legalMoves.some(m => m.startsWith(square))) {
    selected = square;
    draw();
  }
}

function promotionChoice(candidates) {
  const answer = (prompt('Promote to? q, r, b or n', 'q') || '').trim().toLowerCase();
  return candidates.find(m => m.endsWith(answer)) || candidates.find(m => m.endsWith('q'));
}

function say(text, bad) {
  $('status').textContent = text;
  $('status').className = bad ? 'state bad' : 'state';
}

/** Reads a ProblemDetail body, which is why every failure here can say something specific. */
async function fail(response) {
  let detail = response.statusText;
  try {
    const problem = await response.json();
    detail = problem.detail || problem.title || detail;
    if (problem.legalMoves) detail += ` (${problem.legalMoves.length} legal moves here)`;
  } catch { /* not a problem document; the status text will do */ }
  say(`${response.status} · ${detail}`, true);
}

const OUTCOME = {
  WHITE_WON: 'White wins by checkmate.',
  BLACK_WON: 'Black wins by checkmate.',
  DRAW_STALEMATE: 'Draw — stalemate.',
  DRAW_FIFTY_MOVE: 'Draw — fifty-move rule.',
  DRAW_REPETITION: 'Draw — repetition.',
  DRAW_INSUFFICIENT_MATERIAL: 'Draw — neither side can mate.',
  RESIGNED: 'You resigned.'
};

function render() {
  draw();
  $('moves').textContent = game && game.moves.length ? game.moves.join(' ') : '—';

  if (game.status === 'IN_PROGRESS') {
    say(game.yourTurn ? (game.inCheck ? 'Your move — you are in check.' : 'Your move.') : 'Thinking…',
        false);
  } else {
    say(OUTCOME[game.status] || game.status, false);
  }

  const over = game.status !== 'IN_PROGRESS';
  $('resign').disabled = over;
  $('analyse').disabled = over;
}

async function newGame() {
  selected = null;
  $('think').innerHTML = '';
  showReply(null);
  say('Starting…', false);

  const playAsWhite = $('colour').value === 'true';
  flipped = !playAsWhite;

  const response = await fetch('/api/games', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ difficulty: $('level').value, playAsWhite })
  });
  if (!response.ok) return fail(response);

  game = await response.json();
  // The engine may already have moved, if it has white.
  showReply(game.lastReply);
  remember();
  render();
}

/**
 * Puts the game's id in the address bar, so the URL identifies the game rather than the application.
 *
 * <p>`replaceState` rather than `pushState`: a game is one thing that changes, not a series of pages, and
 * filling the back button with every move would make Back mean something nobody intends.
 */
function remember() {
  history.replaceState(null, '', `?game=${game.id}`);
}

/** Opens a game that already exists — a shared link, a reload, or a capture script. */
async function resume(id) {
  say('Loading…', false);
  const response = await fetch(`/api/games/${id}`);
  if (!response.ok) return fail(response);

  game = await response.json();
  flipped = !game.youAreWhite;
  $('level').value = game.difficulty;
  $('colour').value = String(game.youAreWhite);
  showReply(game.lastReply);
  render();
}

/** Fills the panel that says what the engine thought, or empties it. */
function showReply(reply) {
  if (!reply) {
    ['m-move', 'm-score', 'm-depth', 'm-nodes'].forEach(id => $(id).textContent = '—');
    return;
  }
  $('m-move').textContent = reply.move;
  $('m-score').textContent = (reply.score > 0 ? '+' : '') + (reply.score / 100).toFixed(2);
  $('m-depth').textContent = reply.depth;
  $('m-nodes').textContent = reply.nodes.toLocaleString();
}

async function play(move) {
  say('Thinking…', false);
  draw();

  const response = await fetch(`/api/games/${game.id}/moves`, {
    method: 'POST',
    // The version being looked at. Two fast clicks then produce one move and one 412, rather than two
    // moves from a position the player never saw.
    headers: { 'Content-Type': 'application/json', 'If-Match': `"${game.version}"` },
    body: JSON.stringify({ move })
  });
  if (!response.ok) return fail(response);

  const result = await response.json();
  game = result.game;
  if (result.engineMove) {
    showReply(result.engineMove);
  }
  render();
}

async function resign() {
  const response = await fetch(`/api/games/${game.id}`, { method: 'DELETE' });
  if (!response.ok) return fail(response);
  game = await response.json();
  render();
}

/**
 * Iterative deepening, streamed.
 *
 * Server-sent events rather than polling: the engine finishes depth 1, then 2, and holds a complete
 * answer at every step. Watching the line get rewritten as it sees further is the whole point.
 */
function analyse() {
  if (stream) stream.close();
  const box = $('think');
  box.innerHTML = '';

  stream = new EventSource(`/api/games/${game.id}/analysis?depth=12`);

  stream.addEventListener('iteration', event => {
    const info = JSON.parse(event.data);
    const score = (info.score > 0 ? '+' : '') + (info.score / 100).toFixed(2);
    const line = document.createElement('div');
    line.textContent = `${String(info.depth).padStart(2)}  ${score.padStart(6)}  `
      + `${(info.nodesPerSecond / 1000).toFixed(0)}k/s  ${info.principalVariation.slice(0, 6).join(' ')}`;
    box.prepend(line);
  });

  const close = () => { if (stream) { stream.close(); stream = null; } };
  stream.addEventListener('best', close);
  stream.onerror = close;
}

$('new').addEventListener('click', newGame);
$('resign').addEventListener('click', resign);
$('analyse').addEventListener('click', analyse);

const requested = new URLSearchParams(location.search).get('game');
if (requested) {
  resume(requested);
} else {
  draw();
}
</script>
</body>
</html>
