name: Status page

on:
  push:
    branches: [main]
  schedule:
    # Nightly, so the perft timings and the "updated" stamp stay current even on quiet days.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two deployments at once, and a newer push supersedes an older one still in flight.
  group: status-page
  cancel-in-progress: true

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    # No `contents: write`. Nothing is written back to the repository any more — see the note under the
    # upload step — so this job reads and publishes and can do nothing else.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      # `clean` matters here rather than being tidiness: the generator counts tests by reading the
      # surefire reports, and reports left over from an earlier run — a deep perft run, say — would
      # be counted again and inflate the figure.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Generate the page and cards
        run: |
          java -jar ludus-tools/target/ludus-status.jar \
            --out docs \
            --root . \
            --commit "${{ github.sha }}"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

      # Nothing is committed back. The cards used to be, on the reasoning that a profile README in
      # another repository needs to reference them by URL — but the upload above publishes the whole
      # `docs` directory to Pages, so they already have one:
      #
      #   https://lorenzovicino.github.io/ludus/card-dark.svg
      #   https://lorenzovicino.github.io/ludus/card-light.svg
      #
      # Dropping the commit is worth three things. `main` can be protected, because the only writer
      # that could not go through a pull request was this workflow. The history stops carrying bot
      # commits, which matters in a repository whose history is meant to read as a record of what was
      # measured. And this job no longer needs write access to the repository at all.

  deploy:
    name: Deploy
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
