name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the deep perft runs that are too slow to gate a push.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and fast tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  deep-perft:
    name: Deep perft
    # The full suite counts roughly 600 million nodes. It runs nightly and on demand rather than on
    # every push, so the gating job stays under a couple of minutes — see DESIGN.md §8.3.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Full perft suite
        run: ./mvnw --batch-mode --no-transfer-progress test -Pslow
